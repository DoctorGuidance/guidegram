<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#020407" />
    </linearGradient>
    <linearGradient id="c3_neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="c3_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#00F0FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#c3_bg)" />
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="2" />

  <g filter="url(#c3_glow)" stroke="url(#c3_neon)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Isometric Hexagonal Path forming Letter 'G' with Inward Guidance Arrow -->
    <path d="M 345 185
             L 256 135
             L 155 195
             L 155 315
             L 256 375
             L 355 315
             L 355 255
             L 256 255
             L 295 215" />
  </g>

  <!-- Glowing Cyan Quantum Core Node -->
  <circle cx="295" cy="215" r="10" fill="#FFFFFF" />
  <circle cx="295" cy="215" r="18" fill="#00F0FF" opacity="0.4" />
</svg>

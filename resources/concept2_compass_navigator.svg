<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
    <linearGradient id="c2_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="c2_purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#4B0082" />
    </linearGradient>
    <linearGradient id="c2_needle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="c2_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0072FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#c2_bg)" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />

  <g filter="url(#c2_glow)">
    <!-- Outer Compass Rim forming the 'G' -->
    <path d="M 335 175 
             A 145 145 0 1 0 355 310 
             L 256 310" 
          fill="none" 
          stroke="url(#c2_cyan)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Modern Faceted Compass Needle pointing North-East (Guidance) -->
    <!-- North Point (Cyan Gradient) -->
    <polygon points="256,256 226,240 365,145" fill="url(#c2_needle)" />
    <!-- Center Ridge Shadow -->
    <polygon points="256,256 270,286 365,145" fill="#7DD3FC" opacity="0.8" />
    <!-- South Point (Violet Gradient) -->
    <polygon points="256,256 226,240 147,367" fill="url(#c2_purple)" />
    <polygon points="256,256 270,286 147,367" fill="#6B21A8" />

    <!-- Center Pivot Pivot Ring -->
    <circle cx="256" cy="256" r="16" fill="#090D16" stroke="#00F5FF" stroke-width="6" />
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="45%" stop-color="#0066FE" />
      <stop offset="100%" stop-color="#6B11FF" />
    </linearGradient>

    <!-- Glass Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0055ff" flood-opacity="0.45" />
    </filter>

    <!-- Inner Shadow for 3D depth -->
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#001850" flood-opacity="0.35" />
    </filter>

    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2EEFF" />
    </linearGradient>

    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBDDF8" />
      <stop offset="100%" stop-color="#93B8F2" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Base with Deep Modern Elevation -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Elegant Inner Border (Glass Stroke) -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6" />

  <!-- Stylized Geometric "G" Monogram Integrated with Supersonic Paper Airplane -->
  <g filter="url(#planeShadow)">
    <!-- Main Swept Wing (Left to Tip) -->
    <path d="M 125 258 L 385 142 C 392 139 398 147 394 153 L 298 368 C 294 376 283 376 279 368 L 244 290 L 132 272 C 122 270 119 261 125 258 Z" fill="url(#planeGrad)" />

    <!-- Center Fold / Depth Shadow Wing -->
    <path d="M 244 290 L 394 153 L 298 368 Z" fill="url(#foldGrad)" />

    <!-- Trailing Guidance Jet / Speed Fin creating the 'G' loop -->
    <path d="M 244 290 L 222 346 C 220 351 226 355 230 352 L 279 318 Z" fill="#7AA2E3" />

    <!-- Compass / Guidance Cross Dot at Upper Right of the Plane -->
    <circle cx="396" cy="142" r="7" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>

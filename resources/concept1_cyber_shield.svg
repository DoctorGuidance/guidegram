<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <linearGradient id="c1_shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="c1_star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="c1_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0066FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#c1_bg)" />
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="3" />

  <!-- Shield G Geometry -->
  <g filter="url(#c1_glow)">
    <!-- Outer Shield Contour -->
    <path d="M 256 95 
             L 375 145 
             C 375 275, 325 365, 256 415 
             C 187 365, 137 275, 137 145 
             Z" 
          fill="none" 
          stroke="url(#c1_shield)" 
          stroke-width="26" 
          stroke-linejoin="round" />

    <!-- Inner Stylized "G" Loop -->
    <path d="M 285 205
             C 275 195, 260 190, 242 190
             C 205 190, 180 220, 180 260
             C 180 300, 205 330, 245 330
             C 285 330, 310 305, 310 265
             L 242 265"
          fill="none"
          stroke="url(#c1_shield)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 4-Point Guiding Star in Upper Right -->
    <path d="M 375 145 L 383 130 L 398 122 L 383 114 L 375 99 L 367 114 L 352 122 L 367 130 Z" fill="url(#c1_star)" />
  </g>
</svg>

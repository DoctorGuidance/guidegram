<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Ribbon 1: Outer Pulse Orbit -->
    <linearGradient id="c4_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Ribbon 2: Inner Guidance Jet -->
    <linearGradient id="c4_grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="c4_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0066FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#c4_bg)" />

  <g filter="url(#c4_glow)">
    <!-- Arc 1: The 'G' Arch and Telegram Protocol Ripple -->
    <path d="M 330 170
             C 290 120, 210 115, 160 165
             C 105 220, 105 300, 160 355
             C 215 410, 305 400, 355 345"
          fill="none"
          stroke="url(#c4_grad1)"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- Ribbon 2: The Guidance Cross-Vector into the G-core -->
    <path d="M 195 315
             L 330 180
             M 330 180 L 255 180
             M 330 180 L 330 255"
          fill="none"
          stroke="url(#c4_grad2)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Core Signal Pulse Node -->
    <circle cx="348" cy="162" r="10" fill="#FFFFFF" />
  </g>
</svg>

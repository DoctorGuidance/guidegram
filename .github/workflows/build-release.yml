name: Manual Multiplatform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"
      release_title:
        description: "Release Title (e.g. Guidegram v1.1.0)"
        required: true
        default: "Guidegram v1.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and Bundle Frontend & Electron
        run: pnpm run build

      - name: Build macOS Universal DMG
        if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac dmg --universal --publish never

      - name: Build Windows Portable ZIP
        if: runner.os == 'Windows'
        run: |
          pnpm exec electron-builder --win dir --publish never
          powershell -Command "Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath 'release/Guidegram-Windows-x64-Portable.zip' -Force"

      - name: Build Linux Standalone AppImage
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux AppImage --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guidegram-${{ runner.os }}
          path: |
            release/*.dmg
            release/Guidegram-Windows-x64-Portable.zip
            release/*.AppImage
          if-no-files-found: warn

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Consolidate Release Assets
        run: |
          mkdir -p final-assets
          find release-assets -type f -exec mv -t final-assets/ {} +
          ls -la final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || format('Guidegram {0}', github.ref_name) }}
          files: final-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

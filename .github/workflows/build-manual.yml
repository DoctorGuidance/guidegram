name: Build Multiplatform Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      create_release:
        description: 'Publish assets to GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and Bundle
        run: pnpm run build

      - name: Build Windows Executable
        if: matrix.os == 'windows-latest'
        run: pnpm exec electron-builder --win dir

      - name: Archive Windows Release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/Guidegram-${{ github.event.inputs.release_tag }}-Windows-x64.zip" -Force

      - name: Build Linux (AppImage & Tar)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec electron-builder --linux

      - name: Build macOS (DMG & Zip)
        if: matrix.os == 'macos-latest'
        run: pnpm exec electron-builder --mac

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guidegram-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz

  publish:
    needs: build
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "Guidegram ${{ github.event.inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/guidegram-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
